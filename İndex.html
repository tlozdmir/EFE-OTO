
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFE OTO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      padding: 20px;
    }
    .kutu {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #123b66; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
    }
    button {
      background: #167347;
      color: white;
      border: none;
    }
    .toplam-kutu { max-width:420px; margin: 18px auto -30px; padding:20px; background:#f1fff6; border:2px solid #167347; border-radius:15px; text-align:center; box-sizing:border-box; }
    .toplam-kutu strong { display:block; color:#167347; font-size:36px; margin-top:6px; }
    .parca-kart { background:#f6f9fc; border:1px solid #d8e1eb; border-radius:12px; padding:14px; margin:10px 0; line-height:1.7; overflow-wrap:anywhere; }
    .parca-kart b { color:#123b66; }
    .islem-kutu {background:#f6f9fc;border:1px solid #d8e1eb;border-radius:12px;padding:14px;margin-top:16px}
    .islem-kutu h3 {margin-top:0;color:#123b66}
    .uyari {background:#fff4d6;border:1px solid #e6ae36;border-radius:10px;padding:12px;margin:10px 0}
    .ikili {display:flex;gap:8px}.ikili button{flex:1}
    .ikincil {background:#526477}
    .stok-butonlari { display: flex; gap: 6px; margin-top: 8px; }
    .stok-butonlari button { flex: 1; min-width: 0; width: auto; padding: 13px 3px; font-size: 12px; white-space: nowrap; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="kutu" id="girisKutusu">
    <h1>EFE OTO</h1>
    <h3>Personel Girişi</h3>
    <input id="email" type="email" placeholder="E-posta">
    <input id="sifre" type="password" placeholder="Şifre">
    <button onclick="giris()">Giriş Yap</button>
    <p id="mesaj"></p>
  </div>
<div id="toplamKutu" class="toplam-kutu" style="display:none">
    <div>TOPLAM STOK ADEDİ</div>
    <strong id="toplamStok">—</strong>
    <small>Tüm raflardaki toplam parça adedi</small>
  </div>
<div id="stokEkrani" class="kutu" style="display:none">
  <h2>Parça ve Raf Kaydı</h2>
  <input id="numara" placeholder="Parça numarası">
  <input type="file" id="kamera" accept="image/*">
  <input id="ad" placeholder="Parça adı">
  <input id="raf" placeholder="Raf (örnek: A1)">
  <input id="adet" type="number" min="1" value="1">
  <div class="stok-butonlari">
    <button onclick="parcaKaydet()">KAYDET</button>
    <button onclick="stokDegistir('giris')">+ STOK GİRİŞ</button>
    <button onclick="stokDegistir('cikis')">− STOK ÇIKIŞ</button>
  </div>
  <p id="stokMesaj" role="status"></p>
  <div id="kayitUyarisi" class="uyari" style="display:none" role="alertdialog">
    <b>Bu parça başka rafta kayıtlı!</b><p id="kayitUyariMetni"></p>
    <div class="ikili"><button id="mevcutRafaKaydet">EVET, MEVCUT RAFA KAYDET</button><button class="ikincil" id="kayitIptal">İPTAL</button></div>
  </div>
  <div class="islem-kutu">
    <h3>Raf Taşıma / Birleştirme</h3>
    <input id="tasinacakNumara" placeholder="Taşınacak parça numarası">
    <input id="kaynakRaf" placeholder="Kaynak raf (örnek A3)">
    <input id="hedefRaf" placeholder="Hedef raf (örnek B2)">
    <input id="tasinacakAdet" type="number" min="1" placeholder="Taşınacak adet (tamamı için boş bırak)">
    <button onclick="rafTasi()">RAF TAŞI / BİRLEŞTİR</button>
    <p id="tasimaMesaj" role="status"></p>
  </div>
  <h3>Parça veya Raf Ara</h3>
  
<input id="arama" placeholder="Raf veya parça numarası ara (A1, LX2046)" oninput="parcalariListele()">
<div id="liste"></div>

</div>
  <script>
    const SUPABASE_URL = 'https://edgjgpgtmusxeztlutye.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_j6GJVaSoHtAHk-4Sly3kEw_oiy4Dl8a';
 const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
    
async function giris() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("sifre").value;
  const mesaj = document.getElementById("mesaj");

  mesaj.textContent = "Giriş kontrol ediliyor...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    mesaj.textContent = "Giriş başarısız. E-posta ve şifreni kontrol et.";
  } else {
    mesaj.textContent = "Giriş başarılı! EFE OTO sistemine hoş geldiniz.";
  document.getElementById("stokEkrani").style.display = "block";
   document.getElementById("toplamKutu").style.display = "block";
 parcalariListele();
 toplamStokGuncelle(); }
}
let kayitBekliyor = false;
function kayitUyarisiKapat() { document.getElementById('kayitUyarisi').style.display='none'; kayitBekliyor=false; }
document.getElementById('kayitIptal').onclick=()=>{kayitUyarisiKapat();document.getElementById('stokMesaj').textContent='Kayıt iptal edildi.'};
async function parcaKaydet() {
  if(kayitBekliyor) return;
  const numara=document.getElementById('numara').value.trim().toUpperCase();
  const ad=document.getElementById('ad').value.trim();
  const raf=document.getElementById('raf').value.trim().toUpperCase();
  const adet=Number(document.getElementById('adet').value);
  const mesaj=document.getElementById('stokMesaj');
  if(!numara||!raf||!Number.isSafeInteger(adet)||adet<1){mesaj.textContent='Parça numarası, raf ve geçerli adet gir.';return;}
  mesaj.textContent='Parça kontrol ediliyor...';
  try {
    const kayitlar=(await tumParcalariGetir()).filter(p=>p.parca_numarasi===numara);
    const baska=kayitlar.filter(p=>p.raf_konumu!==raf && Number(p.stok_adedi)>0);
    if(baska.length){
      const hedef=baska[0].raf_konumu;
      document.getElementById('kayitUyariMetni').textContent=`${numara} parçası ${baska.map(p=>p.raf_konumu+' ('+p.stok_adedi+' adet)').join(', ')} rafında mevcut. ${adet} adet ${hedef} rafına eklensin mi?`;
      kayitBekliyor=true;
      document.getElementById('kayitUyarisi').style.display='block';
      document.getElementById('mevcutRafaKaydet').onclick=async()=>{
        if(!kayitBekliyor)return;
        kayitUyarisiKapat();
        await kaydiTamamla(numara,ad,hedef,adet);
      };
      mesaj.textContent='Onay bekleniyor. Onay olmadan kayıt yapılmaz.';
      return;
    }
    await kaydiTamamla(numara,ad,raf,adet);
  }catch(e){mesaj.textContent='Kontrol hatası: '+e.message;}
}
async function kaydiTamamla(numara,ad,raf,adet){
  const mesaj=document.getElementById('stokMesaj');
  mesaj.textContent='Kaydediliyor...';
  try{
    const mevcut=(await tumParcalariGetir()).filter(p=>p.parca_numarasi===numara && p.raf_konumu===raf);
    if(mevcut.length){
      const p=mevcut[0];
      const eski=Number(p.stok_adedi)||0;
      const {data,error}=await supabaseClient.from('parcalar').update({stok_adedi:eski+adet,...(ad?{parca_adi:ad}:{})}).eq('id',p.id).eq('stok_adedi',eski).select('id');
      if(error)throw error;
      if(!data?.length)throw Error('Stok başka bir cihazda değişti. Tekrar dene.');
    }else{
      const {error}=await supabaseClient.from('parcalar').insert({parca_numarasi:numara,parca_adi:ad,raf_konumu:raf,stok_adedi:adet});
      if(error)throw error;
    }
    mesaj.textContent=`${adet} adet ${raf} rafına kaydedildi.`;
    document.getElementById('numara').value='';document.getElementById('ad').value='';
    document.getElementById('adet').value='1';document.getElementById('kamera').value='';
    await toplamStokGuncelle();await parcalariListele({sonKayit:{numara,raf}});
  }catch(e){mesaj.textContent='Kayıt yapılamadı: '+e.message;}
}
async function rafTasi(){
  const numara=document.getElementById('tasinacakNumara').value.trim().toUpperCase();
  const kaynak=document.getElementById('kaynakRaf').value.trim().toUpperCase();
  const hedef=document.getElementById('hedefRaf').value.trim().toUpperCase();
  const miktarMetni=document.getElementById('tasinacakAdet').value.trim();
  const mesaj=document.getElementById('tasimaMesaj');
  if(!numara||!kaynak||!hedef||kaynak===hedef){mesaj.textContent='Parça numarası ve birbirinden farklı iki raf gir.';return;}
  if(miktarMetni && (!Number.isSafeInteger(Number(miktarMetni))||Number(miktarMetni)<1)){mesaj.textContent='Geçerli adet gir.';return;}
  mesaj.textContent='Raflar kontrol ediliyor...';
  try{
    const parcalar=(await tumParcalariGetir()).filter(p=>p.parca_numarasi===numara);
    const kaynaklar=parcalar.filter(p=>p.raf_konumu===kaynak);
    const hedefler=parcalar.filter(p=>p.raf_konumu===hedef);
    const toplam=kaynaklar.reduce((a,p)=>a+Number(p.stok_adedi||0),0);
    const adet=miktarMetni?Number(miktarMetni):toplam;
    if(!kaynaklar.length||toplam<adet||adet<1){mesaj.textContent='Kaynak rafta yeterli stok bulunamadı.';return;}
    if(!confirm(`${numara}: ${kaynak} rafından ${hedef} rafına ${adet} adet taşınacak. ${hedefler.length?'Hedefteki stokla birleştirilecek.':''} Onaylıyor musun?`)){mesaj.textContent='İşlem iptal edildi.';return;}
    // Çok kullanıcılı ortamda işlemi atomik yapmak için veritabanı RPC gerekir.
    // Bu sürümde kısmi hata halinde geri alma denenir.
    mesaj.textContent='Taşınıyor...';
    let kalan=adet;const azaltmalar=[];
    for(const p of kaynaklar){
      if(kalan===0)break;
      const eski=Number(p.stok_adedi)||0, al=Math.min(eski,kalan);
      if(!al)continue;
      const {data,error}=await supabaseClient.from('parcalar').update({stok_adedi:eski-al}).eq('id',p.id).eq('stok_adedi',eski).select('id');
      if(error||!data?.length){
        for(const d of azaltmalar.reverse())await supabaseClient.from('parcalar').update({stok_adedi:d.eski}).eq('id',d.id).eq('stok_adedi',d.yeni);
        throw Error('Kaynak stok değişti veya güncellenemedi. Rafları kontrol et.');
      }
      azaltmalar.push({id:p.id,eski,yeni:eski-al});kalan-=al;
    }
    let hata=null;
    if(hedefler.length){
      const p=hedefler[0],eski=Number(p.stok_adedi)||0;
      const sonuc=await supabaseClient.from('parcalar').update({stok_adedi:eski+adet}).eq('id',p.id).eq('stok_adedi',eski).select('id');
      if(sonuc.error||!sonuc.data?.length)hata=sonuc.error||Error('Hedef stok değişti.');
    }else{
      const sonuc=await supabaseClient.from('parcalar').insert({parca_numarasi:numara,parca_adi:kaynaklar[0].parca_adi||'',raf_konumu:hedef,stok_adedi:adet});
      hata=sonuc.error;
    }
    if(hata){
      let geriAlindi=true;
      for(const d of azaltmalar.reverse()){
        const r=await supabaseClient.from('parcalar').update({stok_adedi:d.eski}).eq('id',d.id).eq('stok_adedi',d.yeni).select('id');
        if(r.error||!r.data?.length)geriAlindi=false;
      }
      throw Error('Hedefe eklenemedi. '+(geriAlindi?'Kaynak stok geri alındı.':'Geri alma tamamlanamadı; stokları kontrol et!'));
    }
    mesaj.textContent=`${adet} adet ${kaynak} → ${hedef} taşındı. Toplam stok değişmedi.`;
    document.getElementById('arama').value=numara;
    await toplamStokGuncelle();await parcalariListele();
  }catch(e){mesaj.textContent='Taşıma hatası: '+e.message;}
}
   function parcaKartiOlustur(p) {
     const kart = document.createElement("div");
     kart.className = "parca-kart";
     const satirlar = [
       ["Parça Numarası", p.parca_numarasi || "-"],
       ["Parça Adı", p.parca_adi || "-"],
       ["Raf", p.raf_konumu || "-"],
       ["Adet", p.stok_adedi ?? 0]
     ];
     satirlar.forEach(([baslik, deger]) => {
       const satir = document.createElement("div");
       const etiket = document.createElement("b");
       etiket.textContent = baslik + ": ";
       satir.append(etiket, document.createTextNode(String(deger)));
       kart.appendChild(satir);
     });
     return kart;
   }

   async function tumParcalariGetir() {
     const tumu = [];
     const sayfaBoyutu = 1000;
     for (let baslangic = 0; ; baslangic += sayfaBoyutu) {
       const { data, error } = await supabaseClient.from("parcalar")
         .select("id,parca_numarasi,parca_adi,raf_konumu,stok_adedi")
         .order("id", { ascending: false })
         .range(baslangic, baslangic + sayfaBoyutu - 1);
       if (error) throw error;
       tumu.push(...(data || []));
       if (!data || data.length < sayfaBoyutu) break;
     }
     return tumu;
   }

   async function toplamStokGuncelle() {
     const alan = document.getElementById("toplamStok");
     try {
       const parcalar = await tumParcalariGetir();
       const toplam = parcalar.reduce((t, p) => t + (Number(p.stok_adedi) || 0), 0);
       alan.textContent = toplam.toLocaleString("tr-TR");
     } catch (hata) {
       alan.textContent = "—";
       document.getElementById("stokMesaj").textContent = "Toplam stok alınamadı: " + hata.message;
     }
   }

   async function parcalariListele(secenek = {}) {
     const liste = document.getElementById("liste");
     const arama = document.getElementById("arama").value.trim().toLocaleLowerCase("tr-TR");
     liste.replaceChildren();
     if (!arama && !secenek.sonKayit) return;
     liste.textContent = "Parçalar aranıyor...";
     try {
       const data = await tumParcalariGetir();
       let bulunanlar;
       if (arama) {
         bulunanlar = data.filter(p =>
           (p.parca_numarasi || "").toLocaleLowerCase("tr-TR").includes(arama) ||
           (p.parca_adi || "").toLocaleLowerCase("tr-TR").includes(arama) ||
           (p.raf_konumu || "").toLocaleLowerCase("tr-TR").includes(arama));
       } else {
         bulunanlar = data.filter(p =>
           p.parca_numarasi === secenek.sonKayit.numara &&
           p.raf_konumu === secenek.sonKayit.raf);
       }
       liste.replaceChildren();
       const baslik = document.createElement("h3");
       baslik.textContent = arama
         ? "Arama Sonucu (" + bulunanlar.length + " kayıt)"
         : "Son Kaydedilen Parça";
       liste.appendChild(baslik);
       if (!bulunanlar.length) {
         const bilgi = document.createElement("p");
         bilgi.textContent = "Parça bulunamadı.";
         liste.appendChild(bilgi);
       }
       bulunanlar.forEach(p => liste.appendChild(parcaKartiOlustur(p)));
     } catch (hata) {
       liste.textContent = "Parçalar alınamadı: " + hata.message;
     }
   }
document.getElementById("kamera").addEventListener("change", async function () {
  const dosya = this.files[0];
  if (!dosya) return;

  const mesaj = document.getElementById("stokMesaj");
  mesaj.textContent = "Fotoğraftaki numara okunuyor...";

  try {
    const sonuc = await Tesseract.recognize(dosya, "eng");
    const metin = sonuc.data.text.toUpperCase();
    const numaralar = metin.match(/\b(?=[A-Z0-9./-]*\d)[A-Z0-9][A-Z0-9./-]{3,}\b/g);

    if (numaralar && numaralar.length) {
      document.getElementById("numara").value = numaralar[0];
      mesaj.textContent = "Numara okundu. Kontrol edip kaydedebilirsin.";
    } else {
      mesaj.textContent = "Fotoğrafta okunan yazı: " + metin;
    }
  } catch (hata) {
    mesaj.textContent = "Fotoğraf okunamadı: " + hata.message;
  }
});
async function stokDegistir(tip) {
  
  const numara = document.getElementById("numara").value.trim();
  const miktar = Number(prompt("Kaç adet?"));

  if (!numara || !Number.isInteger(miktar) || miktar <= 0) {
    alert("Parça numarası ve geçerli adet gerekli.");
    return;
  }

  const { data: parca, error } = await supabaseClient
    .from("parcalar")
    .select("id, stok_adedi")
    .eq("parca_numarasi", numara)
    .limit(1).maybeSingle();
  if (error || !parca) {
    alert("Parça bulunamadı.");
    return;
  }

  const yeniStok = Number(parca.stok_adedi) +
    (tip === "giris" ? miktar : -miktar);

  if (yeniStok < 0) {
    alert("Yeterli stok yok.");
    return;
  }

  const { error: hata } = await supabaseClient
    .from("parcalar")
    .update({ stok_adedi: yeniStok })
    .eq("id", parca.id);

  if (hata) {
    alert("Hata: " + hata.message);
    return;
  }

  alert("Stok güncellendi: " + yeniStok);
  await toplamStokGuncelle();
  await parcalariListele({ sonKayit: { numara: numara.toUpperCase(), raf: document.getElementById("raf").value.trim().toUpperCase() } });
} 
  </script>
</body>
