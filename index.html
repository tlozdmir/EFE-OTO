
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFE OTO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      padding: 20px;
    }
    .kutu {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #123b66; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
    }
    button {
      background: #167347;
      color: white;
      border: none;
    }
    .toplam-kutu { max-width:420px; margin: 18px auto -30px; padding:20px; background:#f1fff6; border:2px solid #167347; border-radius:15px; text-align:center; box-sizing:border-box; }
    .toplam-kutu strong { display:block; color:#167347; font-size:36px; margin-top:6px; }
    .parca-kart { background:#f6f9fc; border:1px solid #d8e1eb; border-radius:12px; padding:14px; margin:10px 0; line-height:1.7; overflow-wrap:anywhere; }
    .parca-kart b { color:#123b66; }
    .gizli { display:none!important; }
    .islem { background:#edf5ff; padding:14px; border-radius:12px; margin:15px 0; }
    .islem select { width:100%; padding:12px; margin:7px 0; }
    .islem button { background:#123b66; }
    .uyari { color:#9a5700; font-weight:bold; }
    .stok-butonlari { display: flex; gap: 6px; margin-top: 8px; }
    .stok-butonlari button { flex: 1; min-width: 0; width: auto; padding: 13px 3px; font-size: 12px; white-space: nowrap; }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="kutu" id="girisKutusu">
    <h1>EFE OTO</h1>
    <h3>Personel Girişi</h3>
    <input id="email" type="email" placeholder="E-posta">
    <input id="sifre" type="password" placeholder="Şifre">
    <button onclick="giris()">Giriş Yap</button>
    <p id="mesaj"></p>
  </div>
<div id="toplamKutu" class="toplam-kutu" style="display:none">
    <div>TOPLAM STOK ADEDİ</div>
    <strong id="toplamStok">—</strong>
    <small>Tüm raflardaki toplam parça adedi</small>
  </div>
<div id="stokEkrani" class="kutu" style="display:none">
  <h2>Parça ve Raf Kaydı</h2>
  <input id="numara" placeholder="Parça numarası">
  <input type="file" id="kamera" accept="image/*">
  <input id="ad" placeholder="Parça adı">
  <input id="raf" placeholder="Raf (örnek: A1)">
  <input id="adet" type="number" min="1" value="1">
  <div class="stok-butonlari">
    <button onclick="parcaKaydet()">KAYDET</button>
  </div>
  <p id="stokMesaj"></p>
  <div class="islem">
    <h3>Raf Taşıma / Raf Birleştirme</h3>
    <input id="tasimaNumara" placeholder="Taşınacak parça numarası">
    <button onclick="raflariBul()">Parçanın Raflarını Göster</button>
    <div id="rafBilgisi"></div>
    <label>Kaynak raf</label><select id="kaynakRaf"></select>
    <label>Hedef raf (sen seç)</label><input id="hedefRaf" placeholder="Örn: A3">
    <label>Taşınacak adet</label><input id="tasimaAdet" type="number" min="1" value="1">
    <button onclick="rafIslemi(false)">Seçilen Adedi Taşı</button>
    <button onclick="rafIslemi(true)">Bütün Rafları Seçtiğim Rafta Birleştir</button>
    <p id="rafMesaj"></p>
  </div>
  <button onclick="excelAktar()" style="background:#245e9a">Excel'e Aktar (CSV)</button>
  <h3>Parça veya Raf Ara</h3>
  
<input id="arama" placeholder="Raf veya parça numarası ara (A1, LX2046)" oninput="parcalariListele()">
<div id="liste"></div>

</div>
  <script>
    const SUPABASE_URL = 'https://edgjgpgtmusxeztlutye.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_j6GJVaSoHtAHk-4Sly3kEw_oiy4Dl8a';
 const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
    
async function giris() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("sifre").value;
  const mesaj = document.getElementById("mesaj");

  mesaj.textContent = "Giriş kontrol ediliyor...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    mesaj.textContent = "Giriş başarısız. E-posta ve şifreni kontrol et.";
  } else {
    mesaj.textContent = "Giriş başarılı! EFE OTO sistemine hoş geldiniz.";
  document.getElementById("stokEkrani").style.display = "block";
   document.getElementById("toplamKutu").style.display = "block";
 parcalariListele();
 toplamStokGuncelle(); }
}
async function parcaKaydet() {
  const numara = document.getElementById('numara').value.trim().toUpperCase();
  const ad = document.getElementById('ad').value.trim();
  let raf = document.getElementById('raf').value.trim().toUpperCase();
  const adet = Number(document.getElementById('adet').value);
  const mesaj = document.getElementById('stokMesaj');
  if (!numara || !raf || !Number.isInteger(adet) || adet < 1) {
    mesaj.textContent = 'Parça numarası, raf ve geçerli adet gir.'; return;
  }
  try {
    const {data: rows, error} = await supabaseClient.from('parcalar')
      .select('raf_konumu,stok_adedi').eq('parca_numarasi',numara);
    if (error) throw error;
    const diger = [...new Set((rows||[]).filter(x=>Number(x.stok_adedi)>0 && x.raf_konumu!==raf).map(x=>x.raf_konumu))];
    if (diger.length) {
      const sec = prompt('UYARI: Bu parça şu raflarda mevcut: '+diger.join(', ')+
        '\n1 = Mevcut raflardan birine kaydet\n2 = Yazdığım '+raf+' rafına kaydet\nİptal = Kaydetme', '1');
      if (sec === null) { mesaj.textContent='Kayıt iptal edildi.'; return; }
      if (sec==='1') {
        const secilen=prompt('Hangi mevcut rafa kaydedilsin?\n'+diger.join(', '),diger[0]);
        if (!secilen || !diger.includes(secilen.trim().toUpperCase())) { mesaj.textContent='Geçersiz raf. Kayıt yapılmadı.';return; }
        raf=secilen.trim().toUpperCase();
      } else if (sec!=='2') { mesaj.textContent='Kayıt iptal edildi.';return; }
    }
    if (!confirm(numara+' / '+raf+' rafına '+adet+' adet eklensin mi?')) return;
    const {data, error:rpcHata} = await supabaseClient.rpc('efe_stok_ekle',{
      p_numara:numara,p_ad:ad,p_raf:raf,p_adet:adet
    });
    if (rpcHata) throw rpcHata;
    mesaj.textContent='Kaydedildi: '+numara+' / '+raf+' / +'+adet;
    document.getElementById('numara').value='';
    document.getElementById('ad').value='';
    document.getElementById('adet').value='1';
    document.getElementById('kamera').value='';
    await toplamStokGuncelle(); await parcalariListele({sonKayit:{numara,raf}});
  } catch(e) { mesaj.textContent='Kayıt yapılamadı: '+e.message+' (Önce SQL kurulumunu yapın.)'; }
}

async function raflariBul() {
 const n=document.getElementById('tasimaNumara').value.trim().toUpperCase();
 const alan=document.getElementById('rafBilgisi'), sec=document.getElementById('kaynakRaf');
 alan.textContent='';sec.replaceChildren();
 if(!n){alan.textContent='Parça numarası gir.';return;}
 const {data,error}=await supabaseClient.from('parcalar').select('raf_konumu,stok_adedi').eq('parca_numarasi',n);
 if(error){alan.textContent=error.message;return;}
 const map=new Map();(data||[]).forEach(x=>map.set(x.raf_konumu,(map.get(x.raf_konumu)||0)+Number(x.stok_adedi||0)));
 for(const [raf,adet] of map){
   const o=document.createElement('option');o.value=raf;o.textContent=raf+' ('+adet+' adet)';sec.append(o);
   const d=document.createElement('div');d.textContent=raf+' : '+adet+' adet';alan.append(d);
 }
 if(!map.size) alan.textContent='Parça bulunamadı.';
}
async function rafIslemi(birlestir) {
 const n=document.getElementById('tasimaNumara').value.trim().toUpperCase();
 const kaynak=document.getElementById('kaynakRaf').value;
 const hedef=document.getElementById('hedefRaf').value.trim().toUpperCase();
 const adet=Number(document.getElementById('tasimaAdet').value);
 const mesaj=document.getElementById('rafMesaj');
 if(!n||!hedef||(!birlestir&&(!kaynak||kaynak===hedef||!Number.isInteger(adet)||adet<1))){mesaj.textContent='Parça, farklı hedef raf ve geçerli adet gerekli.';return;}
 const aciklama=birlestir ? n+' parçasının TÜM raflardaki stokları '+hedef+' rafında birleştirilsin mi? Eski kayıtlar silinmez, adetleri sıfırlanır.' : n+' parçasından '+adet+' adet '+kaynak+' rafından '+hedef+' rafına taşınsın mı?';
 if(!confirm(aciklama))return;
 mesaj.textContent='İşlem yapılıyor...';
 try{
  const {data,error}=await supabaseClient.rpc('efe_raf_islemi',{
   p_numara:n,p_kaynak_raf:birlestir?null:kaynak,p_hedef_raf:hedef,p_adet:birlestir?null:adet,p_birlestir:birlestir
  });
  if(error)throw error;
  mesaj.textContent='İşlem tamamlandı. Taşınan adet: '+data;
  await raflariBul();await toplamStokGuncelle();await parcalariListele();
 }catch(e){mesaj.textContent='İşlem yapılamadı: '+e.message;}
}
async function excelAktar(){
 try{
  const rows=await tumParcalariGetir();
  const cols=['id','parca_numarasi','parca_adi','raf_konumu','stok_adedi'];
  const csv='\uFEFF'+[cols.join(';'),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(';'))].join('\r\n');
  const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.href=url;a.download='EFE_OTO_Stok_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(e){alert('Aktarma hatası: '+e.message);}
}

function parcaKartiOlustur(p) {
     const kart = document.createElement("div");
     kart.className = "parca-kart";
     const satirlar = [
       ["Parça Numarası", p.parca_numarasi || "-"],
       ["Parça Adı", p.parca_adi || "-"],
       ["Raf", p.raf_konumu || "-"],
       ["Adet", p.stok_adedi ?? 0]
     ];
     satirlar.forEach(([baslik, deger]) => {
       const satir = document.createElement("div");
       const etiket = document.createElement("b");
       etiket.textContent = baslik + ": ";
       satir.append(etiket, document.createTextNode(String(deger)));
       kart.appendChild(satir);
     });
     return kart;
   }

   async function tumParcalariGetir() {
     const tumu = [];
     const sayfaBoyutu = 1000;
     for (let baslangic = 0; ; baslangic += sayfaBoyutu) {
       const { data, error } = await supabaseClient.from("parcalar")
         .select("id,parca_numarasi,parca_adi,raf_konumu,stok_adedi")
         .order("id", { ascending: false })
         .range(baslangic, baslangic + sayfaBoyutu - 1);
       if (error) throw error;
       tumu.push(...(data || []));
       if (!data || data.length < sayfaBoyutu) break;
     }
     return tumu;
   }

   async function toplamStokGuncelle() {
     const alan = document.getElementById("toplamStok");
     try {
       const parcalar = await tumParcalariGetir();
       const toplam = parcalar.reduce((t, p) => t + (Number(p.stok_adedi) || 0), 0);
       alan.textContent = toplam.toLocaleString("tr-TR");
     } catch (hata) {
       alan.textContent = "—";
       document.getElementById("stokMesaj").textContent = "Toplam stok alınamadı: " + hata.message;
     }
   }

   async function parcalariListele(secenek = {}) {
     const liste = document.getElementById("liste");
     const arama = document.getElementById("arama").value.trim().toLocaleLowerCase("tr-TR");
     liste.replaceChildren();
     if (!arama && !secenek.sonKayit) return;
     liste.textContent = "Parçalar aranıyor...";
     try {
       const data = await tumParcalariGetir();
       let bulunanlar;
       if (arama) {
         bulunanlar = data.filter(p =>
           (p.parca_numarasi || "").toLocaleLowerCase("tr-TR").includes(arama) ||
           (p.parca_adi || "").toLocaleLowerCase("tr-TR").includes(arama) ||
           (p.raf_konumu || "").toLocaleLowerCase("tr-TR").includes(arama));
       } else {
         bulunanlar = data.filter(p =>
           p.parca_numarasi === secenek.sonKayit.numara &&
           p.raf_konumu === secenek.sonKayit.raf);
       }
       liste.replaceChildren();
       const baslik = document.createElement("h3");
       baslik.textContent = arama
         ? "Arama Sonucu (" + bulunanlar.length + " kayıt)"
         : "Son Kaydedilen Parça";
       liste.appendChild(baslik);
       if (!bulunanlar.length) {
         const bilgi = document.createElement("p");
         bilgi.textContent = "Parça bulunamadı.";
         liste.appendChild(bilgi);
       }
       bulunanlar.forEach(p => liste.appendChild(parcaKartiOlustur(p)));
     } catch (hata) {
       liste.textContent = "Parçalar alınamadı: " + hata.message;
     }
   }
document.getElementById("kamera").addEventListener("change", async function () {
  const dosya = this.files[0];
  if (!dosya) return;

  const mesaj = document.getElementById("stokMesaj");
  mesaj.textContent = "Fotoğraftaki numara okunuyor...";

  try {
    const sonuc = await Tesseract.recognize(dosya, "eng");
    const metin = sonuc.data.text.toUpperCase();
    const numaralar = metin.match(/\b(?=[A-Z0-9./-]*\d)[A-Z0-9][A-Z0-9./-]{3,}\b/g);

    if (numaralar && numaralar.length) {
      document.getElementById("numara").value = numaralar[0];
      mesaj.textContent = "Numara okundu. Kontrol edip kaydedebilirsin.";
    } else {
      mesaj.textContent = "Fotoğrafta okunan yazı: " + metin;
    }
  } catch (hata) {
    mesaj.textContent = "Fotoğraf okunamadı: " + hata.message;
  }
});
 supabaseClient.auth.getSession().then(({data})=>{
   if(data?.session){
     document.getElementById('girisKutusu').classList.add('gizli');
     document.getElementById('stokEkrani').style.display='block';
     document.getElementById('toplamKutu').style.display='block';
     toplamStokGuncelle();
   }
 });
  </script>
</body>
</html>
