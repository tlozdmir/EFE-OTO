
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EFE OTO</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      padding: 20px;
    }
    .kutu {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #123b66; text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
    }
    button {
      background: #167347;
      color: white;
      border: none;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="kutu">
    <h1>EFE OTO</h1>
    <h3>Personel Girişi</h3>
    <input id="email" type="email" placeholder="E-posta">
    <input id="sifre" type="password" placeholder="Şifre">
    <button onclick="giris()">Giriş Yap</button>
    <p id="mesaj"></p>
  </div>
<div id="stokEkrani" class="kutu" style="display:none">
  <h2>Parça ve Raf Kaydı</h2>
  <input id="numara" placeholder="Parça numarası">
  <input type="file" id="kamera" accept="image/*">
  <input id="ad" placeholder="Parça adı">
  <input id="raf" placeholder="Raf (örnek: A1)">
  <input id="adet" type="number" min="1" value="1">
  <button onclick="parcaKaydet()">Parçayı Kaydet</button>
  <p id="stokMesaj"></p>
  <h3>Kayıtlı Parçalar</h3>
  
<input id="arama" placeholder="Raf veya parça numarası ara (A1, LX2046)" oninput="parcalariListele()">
<div id="liste"></div>
<button onclick="stokDegistir('giris')">➕ STOK GİRİŞ</button>
<button onclick="stokDegistir('cikis')">➖ STOK ÇIKIŞ</button>
</div>
  <script>
    const SUPABASE_URL = 'https://edgjgpgtmusxeztlutye.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_j6GJVaSoHtAHk-4Sly3kEw_oiy4Dl8a';
 const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 
    
async function giris() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("sifre").value;
  const mesaj = document.getElementById("mesaj");

  mesaj.textContent = "Giriş kontrol ediliyor...";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    mesaj.textContent = "Giriş başarısız. E-posta ve şifreni kontrol et.";
  } else {
    mesaj.textContent = "Giriş başarılı! EFE OTO sistemine hoş geldiniz.";
  document.getElementById("stokEkrani").style.display = "block";
 parcalariListele(); }
}
function temizNumara(v) { return String(v || "").trim().toUpperCase().replace(/\s+/g, ""); }
function temizRaf(v) { return String(v || "").trim().toUpperCase(); }
async function parcaKaydet() {
  const numara = temizNumara(document.getElementById("numara").value);
  const ad = document.getElementById("ad").value.trim();
  const raf = temizRaf(document.getElementById("raf").value);
  const adet = Number(document.getElementById("adet").value);
  const mesaj = document.getElementById("stokMesaj");
  if (!numara || !raf || !Number.isInteger(adet) || adet < 1) {
    mesaj.textContent = "Parça numarası, raf ve geçerli adet gir."; return;
  }
  mesaj.textContent = "Stok kontrol ediliyor...";
  const { data: kayitlar, error } = await supabaseClient.from("parcalar")
    .select("id,parca_numarasi,parca_adi,raf_konumu,stok_adedi");
  if (error) { mesaj.textContent = "Arama hatası: " + error.message; return; }
  const eslesenler = (kayitlar || []).filter(p => temizNumara(p.parca_numarasi) === numara && temizRaf(p.raf_konumu) === raf);
  if (eslesenler.length) {
    const hedef = eslesenler.slice().sort((a,b) => Number(a.id)-Number(b.id))[0];
    const yeniAdet = eslesenler.reduce((t,p) => t + Number(p.stok_adedi || 0), 0) + adet;
    const { data: sonuc, error: hata } = await supabaseClient.from("parcalar")
      .update({stok_adedi:yeniAdet, ...(ad ? {parca_adi:ad} : {})})
      .eq("id",hedef.id).select("id,stok_adedi");
    if (hata || !sonuc || sonuc.length !== 1 || Number(sonuc[0].stok_adedi) !== yeniAdet) {
      mesaj.textContent = "Stok güncellenemedi. " + (hata?.message || "Güncelleme iznini kontrol edin."); return;
    }
    // Eski mükerrer kayıtlar güvenlik için silinmez; liste toplamı tek satır gösterir.
    mesaj.textContent = "Stok güncellendi. " + numara + " / " + raf + " toplam: " + yeniAdet;
  } else {
    const { data: sonuc, error: hata } = await supabaseClient.from("parcalar")
      .insert({parca_numarasi:numara,parca_adi:ad,raf_konumu:raf,stok_adedi:adet})
      .select("id");
    if (hata || !sonuc || sonuc.length !== 1) {
      mesaj.textContent = "Kayıt doğrulanamadı: " + (hata?.message || "Yetki kontrolü gerekli."); return;
    }
    mesaj.textContent = "Parça kaydedildi: " + numara;
  }
  document.getElementById("numara").value = "";
  document.getElementById("ad").value = "";
  document.getElementById("adet").value = "1";
  document.getElementById("kamera").value = "";
  await parcalariListele();
}
async function parcalariListele() {
  const liste = document.getElementById("liste");
  liste.textContent = "Parçalar yükleniyor...";
  const {data,error} = await supabaseClient.from("parcalar")
    .select("parca_numarasi,parca_adi,raf_konumu,stok_adedi");
  if (error) {liste.textContent = "Liste hatası: " + error.message;return;}
  const toplamlar = new Map();
  for (const p of (data || [])) {
    const numara = temizNumara(p.parca_numarasi), raf = temizRaf(p.raf_konumu);
    const key = JSON.stringify([numara,raf]);
    if (!toplamlar.has(key)) toplamlar.set(key,{numara,raf,ad:p.parca_adi || "",adet:0});
    const item=toplamlar.get(key);item.ad ||= p.parca_adi || "";
    item.adet += Number(p.stok_adedi || 0);
  }
  const arama=document.getElementById("arama").value.trim().toLocaleLowerCase("tr-TR");
  liste.replaceChildren();
  for (const p of toplamlar.values()) {
    if (![p.numara,p.raf,p.ad].some(v => v.toLocaleLowerCase("tr-TR").includes(arama))) continue;
    const satir=document.createElement("div");satir.className="item";
    satir.textContent=p.numara+" | "+p.ad+" | Raf: "+p.raf+" | Toplam adet: "+p.adet;
    liste.appendChild(satir);
  }
}
document.getElementById("kamera").addEventListener("change", async function () {
  const dosya = this.files[0];
  if (!dosya) return;

  const mesaj = document.getElementById("stokMesaj");
  mesaj.textContent = "Fotoğraftaki numara okunuyor...";

  try {
    const sonuc = await Tesseract.recognize(dosya, "eng");
    const metin = sonuc.data.text.toUpperCase();
    const numaralar = metin.match(/\b(?=[A-Z0-9./-]*\d)[A-Z0-9][A-Z0-9./-]{3,}\b/g);

    if (numaralar && numaralar.length) {
      document.getElementById("numara").value = numaralar[0];
      mesaj.textContent = "Numara okundu. Kontrol edip kaydedebilirsin.";
    } else {
      mesaj.textContent = "Fotoğrafta okunan yazı: " + metin;
    }
  } catch (hata) {
    mesaj.textContent = "Fotoğraf okunamadı: " + hata.message;
  }
});
async function stokDegistir(tip) {
  const numara = temizNumara(document.getElementById("numara").value);
  const raf = temizRaf(document.getElementById("raf").value);
  if (!numara || !raf) {alert("Parça numarası ve raf gir.");return;}
  const giris = prompt("Kaç adet?"); if (giris === null) return;
  const miktar=Number(giris);
  if (!Number.isInteger(miktar) || miktar<=0) {alert("Geçerli adet gir.");return;}
  const {data,error}=await supabaseClient.from("parcalar")
    .select("id,parca_numarasi,raf_konumu,stok_adedi");
  if (error) {alert(error.message);return;}
  const eslesenler=(data || []).filter(p => temizNumara(p.parca_numarasi)===numara && temizRaf(p.raf_konumu)===raf);
  if (!eslesenler.length) {alert("Bu rafta parça bulunamadı.");return;}
  const toplam=eslesenler.reduce((t,p)=>t+Number(p.stok_adedi || 0),0);
  const yeni=toplam+(tip==="giris"?miktar:-miktar);
  if (yeni<0) {alert("Yeterli stok yok.");return;}
  const hedef=eslesenler.slice().sort((a,b)=>Number(a.id)-Number(b.id))[0];
  // Diğer mükerrer satırları silmeden toplam stok hedef satıra yazılır.
  const diger=toplam-Number(hedef.stok_adedi || 0);
  const {data:sonuc,error:hata}=await supabaseClient.from("parcalar")
    .update({stok_adedi:yeni-diger}).eq("id",hedef.id).select("id,stok_adedi");
  if (hata || !sonuc || sonuc.length!==1) {alert("Güncelleme başarısız: "+(hata?.message || "Yetki hatası"));return;}
  alert("Yeni toplam stok: "+yeni);await parcalariListele();
}
  </script>
</body>
</html>
